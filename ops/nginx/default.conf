server {
    listen 80;
    server_name _;

    root /site;
    index index.html;

    # Send logs to Docker for Dozzle
    access_log /dev/stdout;

    # Also retain access logs in a file
    access_log /var/log/nginx/docsy-access.log;

    error_log /dev/stderr warn;

    location / {
        try_files $uri $uri/ =404;
    }
}
